[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["shared/**"]
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/contact-enquiry"
  to = "/.netlify/functions/contact-enquiry"
  status = 200

[[redirects]]
  from = "/api/stock"
  to = "/.netlify/functions/stock"
  status = 200

[[redirects]]
  from = "/api/catalogue.js"
  to = "/.netlify/functions/catalogue"
  status = 200

[[redirects]]
  from = "/api/product-image"
  to = "/.netlify/functions/product-image"
  status = 200
